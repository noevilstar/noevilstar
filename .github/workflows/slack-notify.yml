name: Slack Notify

on:
  workflow_dispatch:
    inputs:
      status:
        description: Notification status
        type: choice
        options:
          - info
          - success
          - failure
          - warning
        default: info
      summary:
        description: Short Slack summary
        required: false
        default: Manual project notification
      details:
        description: Optional extra details
        required: false
        default: ""
  workflow_call:
    inputs:
      status:
        required: false
        type: string
        default: info
      summary:
        required: false
        type: string
        default: Workflow notification
      details:
        required: false
        type: string
        default: ""
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Send Slack notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          STATUS: ${{ inputs.status }}
          SUMMARY: ${{ inputs.summary }}
          DETAILS: ${{ inputs.details }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_NAME: ${{ vars.SLACK_CHANNEL_NAME }}
          SLACK_CHANNEL_URL: ${{ vars.SLACK_CHANNEL_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_BOT_TOKEN}" ] && [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::notice::Set SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL to enable Slack notifications."
            exit 0
          fi

          case "${STATUS}" in
            success|succeeded|passed)
              icon=":large_green_circle:"
              ;;
            failure|failed|cancelled|timed_out)
              icon=":red_circle:"
              ;;
            warning|neutral|skipped)
              icon=":large_yellow_circle:"
              ;;
            *)
              icon=":large_blue_circle:"
              ;;
          esac

          short_sha="${GITHUB_SHA::7}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="${icon} *${GITHUB_REPOSITORY}* ${STATUS}\n*Summary:* ${SUMMARY}\n*Workflow:* ${GITHUB_WORKFLOW}\n*Run:* <${run_url}|${GITHUB_RUN_NUMBER}>\n*Ref:* ${GITHUB_REF_NAME}\n*SHA:* ${short_sha}"

          if [ -n "${DETAILS}" ]; then
            message="${message}\n*Details:* ${DETAILS}"
          fi

          if [ -n "${SLACK_BOT_TOKEN}" ]; then
            if [ -z "${SLACK_CHANNEL_ID}" ]; then
              echo "::error::SLACK_CHANNEL_ID repo variable is required when using SLACK_BOT_TOKEN."
              exit 1
            fi

            payload="$(jq -n --arg channel "${SLACK_CHANNEL_ID}" --arg text "${message}" '{channel: $channel, text: $text, unfurl_links: false, unfurl_media: false}')"
            response="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "${payload}")"

            ok="$(printf '%s' "${response}" | jq -r '.ok')"
            if [ "${ok}" != "true" ]; then
              printf '%s\n' "${response}"
              exit 1
            fi
          else
            payload="$(jq -n --arg text "${message}" '{text: $text}')"
            curl -sS -X POST -H "Content-Type: application/json" --data "${payload}" "${SLACK_WEBHOOK_URL}" >/dev/null
          fi
